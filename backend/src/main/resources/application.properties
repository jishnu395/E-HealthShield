spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ehealthshield_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.port=8080

app.crypto.sse-master-key=${APP_CRYPTO_SSE_MASTER_KEY:dev_sse_master_key_placeholder_change_in_production}
app.crypto.kyber-variant=ML-KEM-768

app.blockchain.rpc-url=${ETH_RPC_URL:http://127.0.0.1:8545}
app.blockchain.contract-address=${CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
app.blockchain.chain-id=${CHAIN_ID:31337}
app.blockchain.signer-address=${SIGNER_ADDRESS:0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}